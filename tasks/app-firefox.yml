---

# USAGE: Task installs Firefox from third-party apt repo.

# ***

# Avoid error running deb822_repository module: "An exception
# occurred ... ModuleNotFoundError: No module named 'debian'".
- name: 'Install python3-debian for deb822_repository usage'
  become: true
  ansible.builtin.apt:
    name: python3-debian
    state: present

# ***

# REFER/THANX/2026-10-14:
# https://support.mozilla.org/en-US/kb/install-firefox-linux

# "Create a directory to store APT repository keys if it doesn't exist":
# - Manly:
#   sudo install -d -m 0755 /etc/apt/keyrings
# - Altly:
#   - name: Ensure /etc/apt/keyrings
#     ansible.builtin.command: install -d -m 0755 /etc/apt/keyrings
#     become: true

- name: Ensure directory exists for /etc/apt/keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

# "Import the Mozilla APT repository signing key:
# - Prereq.:
#   apt install wget
# - Manly:
#   wget -q https://packages.mozilla.org/apt/repo-signing-key.gpg -O- \
#     | sudo tee /etc/apt/keyrings/packages.mozilla.org.asc > /dev/null

# FIXME:
#
# "The fingerprint should be 35BAA0B33E9EB396F59CA838C0BA5CE6DC6315A3.
# You may check it with the following command":
# - Manly:
#   gpg -n -q --import --import-options import-show /etc/apt/keyrings/packages.mozilla.org.asc \
#     | awk '/pub/{getline; gsub(/^ +| +$/,"");
#       if ($0 == "35BAA0B33E9EB396F59CA838C0BA5CE6DC6315A3") print "\nThe key fingerprint matches ("$0").\n";
#       else print "\nVerification failed: the fingerprint ("$0") does not match the expected one.\n"}'

# "Next, add the Mozilla APT repository to your sources.list":
# - "For Debian Bookworm/Ubuntu Noble and Older":
#   - Manly:
#     # echo \
#     #   "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc]" \
#     #     "https://packages.mozilla.org/apt mozilla main" \
#     #   | sudo tee -a /etc/apt/sources.list.d/mozilla.list > /dev/null
# - "For Debian Trixie/Ubuntu Resolute and Newer":
#   - Manly:
#     sudo tee /etc/apt/sources.list.d/mozilla.sources > /dev/null << EOF
#     Types: deb
#     URIs: https://packages.mozilla.org/apt
#     Suites: mozilla
#     Components: main
#     Signed-By: /etc/apt/keyrings/packages.mozilla.org.asc
#     EOF

# CXREF: Creates:
# /etc/apt/keyrings/mozilla.asc
# /etc/apt/sources.list.d/mozilla.sources
- name: Add ~~Firefox~~ Mozilla APT repository
  become: true
  ansible.builtin.deb822_repository:
    # name: firefox
    name: mozilla
    types: [deb]
    uris:
      - "https://packages.mozilla.org/apt"
    signed_by: "https://packages.mozilla.org/apt/repo-signing-key.gpg"
    suites: [mozilla]
    components: [main]
    state: present
    enabled: true

# "Configure APT to prioritize packages from the Mozilla repository":
# - Manly:
#   sudo tee /etc/apt/preferences.d/mozilla > /dev/null << EOF
#   Package: *
#   Pin: origin packages.mozilla.org
#   Pin-Priority: 1000
#   EOF

- name: Prioritize 'firefox' via /etc/apt/preferences.d/mozilla
  become: true
  ansible.builtin.copy:
    content: |
      Package: *
      Pin: origin packages.mozilla.org
      Pin-Priority: 1000
    dest: /etc/apt/preferences.d/mozilla
    owner: root
    group: root
    mode: '0644'

# ISOFF: Not needed (not Snap version installed by DepoXy):
#
# - "For Ubuntu users: If you want to replace the snap version of firefox to the deb version,
#    you need to pin the firefox snap version from the APT package manager before removing the
#    snap package with sudo snap remove firefox command to prevent unwanted upgrades to the snap
#    version of firefox."
#
#      sudo tee /etc/apt/preferences.d/mozilla > /dev/null << EOF
#      Package: firefox
#      Pin: release o=Ubuntu
#      Pin-Priority: -1
#      EOF

# ***

# "Update your package list, and install firefox (or one of firefox-esr, -beta, -nightly, -devedition)":
# - Manly:
#   sudo apt-get update
#   sudo apt-get install firefox

- name: Run command "apt-get update"
  become: true
  ansible.builtin.apt:
    update_cache: true

- name: Install "firefox"
  become: true
  ansible.builtin.apt:
    name: firefox

# ***
