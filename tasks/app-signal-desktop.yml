---

# USAGE: Task installs Signal from third-party apt repo.

# ***

# Avoid error running deb822_repository module: "An exception
# occurred ... ModuleNotFoundError: No module named 'debian'".
- name: 'Install python3-debian for deb822_repository usage'
  become: true
  ansible.builtin.apt:
    name: python3-debian
    state: present

# ***

- name: Assure /etc/apt/keyrings folder
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
    modification_time: preserve
    access_time: preserve
  become: true

# ***

