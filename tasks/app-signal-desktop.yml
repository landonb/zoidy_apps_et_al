# ***

# REFER/THANX:
# https://signal.org/download/linux/
#
# - Refer:
#   curl https://updates.signal.org/desktop/apt/keys.asc | gpg --dearmor > signal-desktop-keyring.gpg
#   cat signal-desktop-keyring.gpg | sudo tee /usr/share/keyrings/signal-desktop-keyring.gpg > /dev/null
#   curl -o signal-desktop.sources https://updates.signal.org/static/desktop/apt/signal-desktop.sources
#   cat signal-desktop.sources | sudo tee /etc/apt/sources.list.d/signal-desktop.sources > /dev/null

# REFER:
# https://updates.signal.org/static/desktop/apt/signal-desktop.sources
#
# - Refer:
#   Types: deb
#   URIs: https://updates.signal.org/desktop/apt
#   Components: main
#   Architectures: amd64
#   Signed-By: /usr/share/keyrings/signal-desktop-keyring.gpg

# CXREF: Creates:
# /etc/apt/keyrings/signal-desktop.asc
# /etc/apt/sources.list.d/signal-desktop.sources

- name: Add Signal APT repository
  become: true
  ansible.builtin.deb822_repository:
    name: signal-desktop
    types: [deb]
    uris: https://updates.signal.org/desktop/apt
    # ALTLY:
    #   signed_by: /etc/apt/keyrings/packages.signal.org
    signed_by: "https://updates.signal.org/desktop/apt/keys.asc"
    # Xenial 16.04, from 2016! (Not, e.g., '[stable]'.)
    suites: xenial
    components: [main]
    architectures: amd64
    state: present
    enabled: true

# ***

# THANX: Inspired by (copied from):
# https://github.com/hrafnthor/ansible-signal
# https://github.com/hrafnthor/ansible-signal/blob/main/files/signal-desktop-preferences-d
# - Seems a bit pedantic — don't need to Pin for things to work, and
#   in practice shouldn't affect anything — but also feels good from
#   OpSec perspective (restricts APT to only signal-desktop, so it
#   ignores all other packages from their repo).

- name: "Prioritize repository"
  become: true
  ansible.builtin.copy:
    src: signal-desktop-preferences-d
    dest: "/etc/apt/preferences.d/signal-desktop"
    owner: root
    group: root
    mode: "0644"
  when: true

# ALTLY: Nix the priority file:
- name: "HTH | Signal | Remove repository priority"
  become: true
  ansible.builtin.file:
    path: "/etc/apt/preferences.d/signal-desktop"
    state: absent
  when: false

# ***

# - Manly:
#   sudo apt-get update
#   sudo apt-get install signal-desktop

- name: Run command "apt-get update"
  become: true
  ansible.builtin.apt:
    update_cache: true

- name: Install "signal-desktop"
  become: true
  ansible.builtin.apt:
    name: signal-desktop

# ***
